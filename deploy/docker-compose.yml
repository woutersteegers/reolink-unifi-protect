# House deployment: Reolink Elite Floodlight WiFi -> UniFi Protect,
# pure passthrough (NO transcoding):
#   video1 = camera's native H.265 main stream (5120x1552), declared honestly
#            via --hi-codec h265 (needs Protect's H.265/"enhanced" support)
#   video2/video3 = camera's native H.264 sub stream (1920x576@30)
#
# Secrets (camera password, adoption token) come from an .env file that lives
# ONLY on the NAS next to this compose and is gitignored. Required vars:
#   NVR_IP, ADOPTION_TOKEN, CAM_MAC, CAM_IP, CAM_NAME, CAM_USER, CAM_PASS
#
# Protect caches capabilities (model/codec/resolution) at ADOPTION. Changing
# any of them means: remove camera in Protect UI -> fresh token into .env
# (tokens live ~60 min) -> docker compose up -d --force-recreate.
#
# Build + run on the NAS (that is where the camera network is):
#   docker compose up -d --build
services:
  reolink-floodlight-proxy:
    build:
      context: ..
      dockerfile: Dockerfile.vaapi
    image: unifi-cam-proxy:vaapi
    container_name: reolink-floodlight-proxy
    restart: unless-stopped
    # iGPU for the lo-channel h265 transcode (Protect expects EVERY
    # channel in HEVC once enhanced encoding is on).
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
    volumes:
      - ./client.pem:/client.pem:ro
    command:
      - unifi-cam-proxy
      - --host
      - "${NVR_IP}"
      - --cert
      - /client.pem
      - --token
      - "${ADOPTION_TOKEN}"
      - --mac
      - "${CAM_MAC}"
      - --ip
      - "${CAM_IP}"
      - --name
      - "${CAM_NAME}"
      # H.265-capable model. The default (UVC G3) is an H.264-only camera and
      # Protect gates codec capabilities by model, which would likely doom the
      # honest h265 declaration on video1.
      - --model
      - "UVC G5 Pro"
      # Full identity: Protect >=3.0 ignores the model string alone;
      # recognition keys on sysid/platform/firmwareBuild + the hex
      # camera-model WSS header. 0xa598/sav837gw = UVC G5 Pro (redalert
      # model table). fw-version must be the SHORT form with --sysid.
      - --sysid
      - "0xa598"
      - --platform
      - "sav837gw"
      # Claim the current release (what the real cameras run) so Protect
      # doesn't offer/push an upgrade to a camera that can't take one
      # (auto-update is scheduled for 03:00 on this NVR).
      - --fw-version
      - "5.4.122"
      - --fw-build
      - "92ebf37.260724.1639"
      - rtsp
      - -s
      - "rtsp://${CAM_USER}:${CAM_PASS}@${CAM_IP}:554/h264Preview_01_main"
      - "rtsp://${CAM_USER}:${CAM_PASS}@${CAM_IP}:554/h264Preview_01_sub"
      # Snapshots via the camera's HTTPS API instead of a fourth always-on
      # RTSP session (Reolink WiFi cams limit concurrent RTSP connections).
      - --snapshot-url
      - "https://${CAM_IP}/cgi-bin/api.cgi?cmd=Snap&channel=0&rs=proxy&user=${CAM_USER}&password=${CAM_PASS}"
      # Bridge the camera's on-board AI (person/vehicle/animal) into
      # Protect smart detections — no AI Port involved.
      - --reolink-ai-host
      - "${CAM_IP}"
      - --reolink-ai-user
      - "${CAM_USER}"
      - --reolink-ai-password
      - "${CAM_PASS}"
      # Real detection boxes arrive here from the ai-sidecar; the
      # GetAiState poller above stands down while reports are fresh.
      - --ai-sink-port
      - "7999"
      # Audio passthrough (AAC-LC 16k mono, the real UniFi wire format).
      # Timestamps come from the camera's RTP clock (wallclock stamping
      # removed in base.py) so the samples line up gaplessly.
      - --ffmpeg-args
      - "-c:v copy -c:a copy"
      - --hi-codec
      - h265
      - --hi-width
      - "5120"
      - --hi-height
      - "1552"
      - --hi-fps
      - "20"
      - --lo-codec
      - h265
      - --lo-h265-transcode
      - --lo-width
      - "1920"
      - --lo-height
      - "576"
      - --lo-fps
      - "30"

  # Decodes the camera's own AI detection rectangles (person/vehicle/
  # animal, the same boxes the Reolink app draws) off the Baichuan
  # protocol via nodelink-js, and streams them to the proxy so Protect
  # shows moving, accurately-placed detection boxes.
  reolink-ai-sidecar:
    build: ./ai-sidecar
    container_name: reolink-ai-sidecar
    restart: unless-stopped
    depends_on:
      - reolink-floodlight-proxy
    environment:
      - CAM_IP=${CAM_IP}
      - CAM_USER=${CAM_USER}
      - CAM_PASS=${CAM_PASS}
      - SINK_URL=http://reolink-floodlight-proxy:7999/detections
